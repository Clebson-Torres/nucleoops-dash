name: ci-dashboard

on:
  push:
    branches: [teste]
  pull_request:
    branches: [teste, main]

jobs:
  dashboard-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-npm-ci.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log
      - name: Install Playwright browser
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee ci-playwright-install.log
      - name: E2E smoke
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee ci-e2e.log
      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ci-logs
          path: |
            ci-npm-ci.log
            ci-build.log
            ci-playwright-install.log
            ci-e2e.log
            playwright-report
            test-results/e2e-artifacts
